<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="NUVEXA PRO 银白色 N 标识">
<defs><linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset=".44" stop-color="#c2cbd6"/><stop offset=".7" stop-color="#eef1f5"/><stop offset="1" stop-color="#93a1b1"/></linearGradient></defs>
<g class="n-core"><path d="M47 130V50h20l46 53V50h20v80h-20L67 76v54Z" fill="url(#silver)" stroke="#dee4eb" stroke-width=".7" stroke-linejoin="round"/></g>
<g fill="#e9f1fa" class="stars">
<path d="M34 27 37 34 44 37 37 40 34 47 31 40 24 37 31 34Z"/>
<path d="M143 30 145 35 150 37 145 39 143 44 141 39 136 37 141 35Z"/>
<path d="M156 123 159 131 167 134 159 137 156 145 153 137 145 134 153 131Z"/>
<path d="M25 119 27 124 32 126 27 128 25 133 23 128 18 126 23 124Z"/>
<path d="M81 17 82.5 20.5 86 22 82.5 23.5 81 27 79.5 23.5 76 22 79.5 20.5Z"/>
</g>
<style>
.n-core{transform-origin:90px 90px;animation:slow-n 28s ease-in-out infinite;transform-box:view-box}
.stars path{opacity:.7;filter:drop-shadow(0 0 2px #e2eefa);transform-origin:center;animation:starlight 6s ease-in-out infinite alternate}
.stars path:nth-child(2){animation-delay:-1.5s}.stars path:nth-child(3){animation-delay:-2.7s}.stars path:nth-child(4){animation-delay:-4.1s}
@keyframes slow-n{0%{transform:perspective(580px) rotateY(0deg)}50%{transform:perspective(580px) rotateY(180deg)}100%{transform:perspective(580px) rotateY(360deg)}}
@keyframes starlight{0%{opacity:.25;transform:translateY(4px) scale(.85)}100%{opacity:.92;transform:translateY(-6px) scale(1.1)}}
@media(prefers-reduced-motion:reduce){.n-core,.stars path{animation:none}}
</style></svg>
