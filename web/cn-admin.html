<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CN Capital · 管理后台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
:root{--bg:#0b0d0a;--pn:rgba(255,255,255,.05);--pn2:rgba(255,255,255,.09);--ln:rgba(255,255,255,.13);--ln2:rgba(255,255,255,.22);--tx:#f7f9f2;--mut:#bcc4b2;--ac:#d7ff00;--acb:rgba(215,255,0,.14);--up:#d7ff00;--dn:#ff6b5a;--am:#ffb938;--bl:#5b9cff;--gold:#e8c27a;--ink:#101400;--field:rgba(0,0,0,.38)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
body{margin:0;min-height:100vh;background:radial-gradient(1100px 520px at 0 -6%,#33440f 0%,transparent 62%),radial-gradient(800px 420px at 100% 0,#1b2410 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx);font:13.5px/1.55 Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
b,strong,h3{font-weight:600}
th,.tn,.chip{font-weight:500}
.ph>span:first-child{font-weight:600}.ph small{font-weight:400}
.hide .amt{color:transparent!important;text-shadow:0 0 9px rgba(247,249,242,.75);user-select:none}
/* 顶栏（与前台一致：品牌 / 居中胶囊导航 / 右侧工具） */
.top{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:58px;padding:0 20px;background:rgba(11,13,10,.88);border-bottom:1px solid var(--ln);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:14px;letter-spacing:.08em}
.brand svg{width:30px;height:30px;display:block;filter:drop-shadow(0 2px 8px rgba(232,194,122,.28))}
.brand small{display:block;font-size:11px;letter-spacing:.32em;color:var(--gold);margin-top:1px}
.nav{display:flex;gap:4px;justify-content:center}
.tn{border:1px solid transparent;background:none;color:var(--mut);height:34px;padding:0 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .2s}
.tn:hover{color:var(--tx)}.tn.on{color:var(--ac);background:var(--acb)}
.right{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.sr{height:34px;width:160px;border-radius:999px;border:1px solid var(--ln);background:var(--field);color:var(--tx);padding:0 14px;font-size:12.5px;text-align:center}
.av{width:28px;height:28px;border-radius:50%;background:#3a4a1a;text-align:center;line-height:26px;border:1px solid rgba(215,255,0,.25);flex:none}
/* 页面与面板 */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding:20px 24px 48px;width:100%;max-width:1680px;margin:0 auto;align-items:start}
.c12{grid-column:span 12}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pn{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.04));border:1px solid var(--ln);border-radius:14px;min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ln);font-size:14px}
.ph>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.ph small{color:var(--mut);font-size:12px;margin:0}
.pb{padding:10px 16px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mut);text-align:left;padding:11px 16px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--ln);white-space:nowrap;letter-spacing:.02em}
td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
tr:last-child td{border-bottom:0}tbody tr{transition:background .15s}tbody tr:hover{background:rgba(255,255,255,.04)}
.r{text-align:right}.mut{color:var(--mut)}.up{color:var(--up)}.dn{color:var(--dn)}.tw{color:var(--am)}
.id{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--mut);cursor:pointer;border-bottom:1px dotted rgba(255,255,255,.25)}.id:hover{color:var(--tx)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:999px;font-size:12px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.ok{background:var(--acb);color:var(--up)}.wa{background:rgba(255,185,56,.15);color:var(--am)}.in{background:rgba(91,156,255,.16);color:#8bb8ff}.mu{background:rgba(255,255,255,.1);color:var(--mut)}.rd{background:rgba(255,107,90,.15);color:var(--dn)}
.btn{height:32px;padding:0 15px;border-radius:999px;border:1px solid var(--ln2);background:var(--pn2);color:var(--tx);cursor:pointer;font-size:12.5px;white-space:nowrap;transition:all .18s}
.btn:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.14)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--ink)}.btn.p:hover{background:#e6ff4d}
.btn:disabled{opacity:.4;cursor:not-allowed}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.seg{display:inline-flex;background:rgba(0,0,0,.35);border:1px solid var(--ln);border-radius:999px;padding:2px}
.seg button{border:0;background:none;color:var(--mut);height:28px;padding:0 13px;border-radius:999px;cursor:pointer;font-size:12.5px;transition:all .18s}
.seg button:hover{color:var(--tx)}.seg button.on{background:var(--ac);color:var(--ink)}
input,select,textarea{height:34px;border-radius:999px;border:1px solid var(--ln2);background:var(--field);color:var(--tx);padding:0 14px;min-width:0}
select{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,#aab2a0 50%),linear-gradient(135deg,#aab2a0 50%,transparent 50%);background-position:calc(100% - 17px) 13px,calc(100% - 12px) 13px;background-size:5px 5px;background-repeat:no-repeat}
select option{background:#13150f}
textarea{height:80px;padding:10px 14px;width:100%;border-radius:14px;font:inherit}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(215,255,0,.16)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;justify-content:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--ln)}
.tabs button{border:0;background:none;color:var(--mut);height:30px;padding:0 16px;border-radius:999px;cursor:pointer;font-size:12.5px;transition:all .18s}
.tabs button:hover{color:var(--tx)}.tabs button.on{background:var(--acb);color:var(--ac)}
.tp[hidden],.pg[hidden]{display:none}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}.kv:last-child{border-bottom:0}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.empty{padding:34px 0;text-align:center;color:var(--mut)}
.alloc{display:flex;height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.1);gap:2px}.alloc i{display:block;height:100%;min-width:3px}
/* 概览：指标卡 / 趋势图 / 明细 */
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.sc{display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:78px;padding:13px 16px;position:relative}
.sc>span{color:var(--mut);font-size:11.5px}.sc em{font-style:normal;font-size:21px;letter-spacing:-.01em;line-height:1.2}.sc small{color:var(--mut);font-size:11.5px}
.sc.gold{border-color:rgba(215,255,0,.4);background:linear-gradient(180deg,rgba(215,255,0,.14),rgba(215,255,0,.03))}
.sc.gold em{color:var(--ac);font-size:26px}
.sc svg.sp{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:104px;height:36px;opacity:.9}
.stats2{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.mc{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:72px;padding:11px 16px 11px 18px;position:relative}
.mc::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 3px 3px 0;background:var(--mc-ac,rgba(255,255,255,.16))}
.mc>span{color:var(--mut);font-size:11.5px;letter-spacing:.01em}
.mc em{font-style:normal;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.mc small{color:var(--mut);font-size:11px}
.sc[data-go],.mc[data-go]{cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.sc[data-go]:hover,.mc[data-go]:hover{border-color:var(--ln2);transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.sc[data-go]:active,.mc[data-go]:active{transform:scale(.975);transition-duration:.08s;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.sc[data-go]:focus-visible,.mc[data-go]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mc[data-go]::after{content:"›";position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:17px;line-height:1;color:var(--mut);opacity:0;transition:opacity .15s ease}
.mc[data-go]:hover::after{opacity:.75}
.sc.is-loading,.mc.is-loading{pointer-events:none}
.sc.is-loading>:not(.cardspin),.mc.is-loading>:not(.cardspin){opacity:.42;filter:blur(.4px);transition:opacity .22s ease,filter .22s ease}
.cardspin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;z-index:3;animation:cardspin-in .22s ease}
@keyframes cardspin-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.cardspin.out{animation:cardspin-out .18s ease forwards}
@keyframes cardspin-out{to{opacity:0}}
.cardspin i{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(255,255,255,.18);border-top-color:#fff;border-right-color:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.35));animation:cardspin .68s linear infinite}
.cardspin u{font-style:normal;text-decoration:none;font-size:11px;letter-spacing:.06em;font-weight:600;color:#fff}
@keyframes cardspin{to{transform:rotate(360deg)}}
.ct{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px 0}
.lg{display:flex;gap:14px;color:var(--mut);font-size:12px;align-items:center}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg i.ln{height:2px;width:14px;border-radius:2px;vertical-align:3px}
.cw{position:relative;height:280px;margin:8px 12px 0}
.cw canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.tip{position:absolute;top:6px;min-width:168px;padding:9px 11px;border-radius:12px;background:#1b1f16;border:1px solid var(--ln2);box-shadow:0 10px 28px rgba(0,0,0,.5);font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:3}
.tip.on{opacity:1}.tip b{display:block;margin-bottom:5px}.tip div{display:flex;justify-content:space-between;gap:14px;padding:1.5px 0}.tip div span:first-child{color:var(--mut)}.tip p{margin:5px 0 0;color:var(--mut);font-size:11.5px;border-top:1px solid var(--ln);padding-top:5px}
.cs{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(0,0,0,.18);border:1px solid var(--ln);border-radius:12px;overflow:hidden;margin-top:14px}
.cs div{padding:12px 16px;border-right:1px solid rgba(255,255,255,.07)}.cs div:last-child{border-right:0}
.cs span{display:block;color:var(--mut);font-size:11.5px;letter-spacing:.02em;margin-bottom:5px}.cs b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgd{display:grid;gap:2px;padding:6px 16px 12px}
.lgd .kv{font-size:13px}.lgd .kv>span:first-child{display:flex;align-items:center;gap:8px;color:var(--tx)}
.lgd .sw{width:8px;height:8px;border-radius:3px;flex:none}
.sumbar{display:flex;gap:22px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--ln);color:var(--mut);font-size:12.5px}
.sumbar b{color:var(--tx)}
tr.mutedrow td{opacity:.55}
.fchip{display:none;align-items:center;gap:6px;height:24px;padding:0 6px 0 12px;border-radius:999px;background:var(--acb);color:var(--ac);font-size:12.5px;border:0;cursor:pointer}
.fchip.on{display:inline-flex}.fchip u{text-decoration:none;opacity:.7}
/* 抽屉与弹层（与前台弹窗同款质感） */
.mask{position:fixed;inset:0;background:rgba(5,7,4,.68);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:45}.mask.open{opacity:1;visibility:visible}
.dr{position:absolute;right:0;top:0;bottom:0;width:min(940px,95vw);background:linear-gradient(180deg,#1b1f16,#13150f);border-left:1px solid var(--ln2);border-radius:20px 0 0 20px;box-shadow:0 24px 60px rgba(0,0,0,.55);padding:20px 22px;overflow:auto;transform:translateX(28px);transition:transform .2s ease}
.dr.s{width:min(440px,95vw)}.mask.open .dr{transform:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.dh h3{margin:0;font-size:18px}
.pg:not([hidden]){animation:in .18s ease}@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes pgFade{from{opacity:0}to{opacity:1}}
@keyframes pgLeave{from{opacity:1}to{opacity:0}}
.pg.leaving{animation:pgLeave .15s ease forwards;pointer-events:none}
.pg.enter .pn{animation:pgFade .42s ease backwards}
.pg.enter .pn:nth-of-type(2){animation-delay:.08s}.pg.enter .pn:nth-of-type(3){animation-delay:.15s}.pg.enter .pn:nth-of-type(4){animation-delay:.22s}
.pg.enter tbody tr{animation:pgFade .36s ease backwards}
.pg.enter tbody tr:nth-child(1){animation-delay:.12s}.pg.enter tbody tr:nth-child(2){animation-delay:.2s}.pg.enter tbody tr:nth-child(3){animation-delay:.28s}.pg.enter tbody tr:nth-child(4){animation-delay:.36s}.pg.enter tbody tr:nth-child(5){animation-delay:.44s}.pg.enter tbody tr:nth-child(6){animation-delay:.52s}.pg.enter tbody tr:nth-child(n+7){animation-delay:.56s}
@media(prefers-reduced-motion:reduce){.pg:not([hidden]),.pg.leaving,.pg.enter .pn,.pg.enter tbody tr{animation:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:#1b1f16;border:1px solid var(--ln2);color:var(--tx);padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:1260px){.sr{display:none}}
@media(max-width:1000px){.stats,.stats2{grid-template-columns:1fr 1fr}.top{grid-template-columns:auto 1fr auto;gap:10px}.nav{justify-content:flex-start;overflow-x:auto}.brand small{display:none}.cs{grid-template-columns:1fr 1fr}.cs div:nth-child(2){border-right:0}.cs div:nth-child(-n+2){border-bottom:1px solid rgba(255,255,255,.07)}.grid{padding:12px}}
@media(max-width:560px){.stats,.stats2{grid-template-columns:1fr}.sc svg.sp{display:none}.cw{height:230px}}
/* 弹窗系统 · 统一的分层框线语言 */
.mo{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(5,7,4,.74);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}.mo.open{opacity:1;visibility:visible}
.md{position:relative;width:min(580px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden;border-radius:22px;border:1px solid var(--ln2);background:radial-gradient(460px 170px at 0 0,rgba(215,255,0,.1),transparent 70%),linear-gradient(180deg,#1f241a,#12150e);box-shadow:0 0 0 7px rgba(255,255,255,.025),0 46px 100px rgba(0,0,0,.66);transform:translateY(14px) scale(.98);transition:transform .28s cubic-bezier(.2,.8,.2,1)}.mo.open .md{transform:none}
.md::before{content:"";position:absolute;left:26px;right:26px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),var(--ac),transparent)}.md.dg::before{background:linear-gradient(90deg,transparent,var(--dn),transparent)}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 26px 18px;border-bottom:1px solid var(--ln);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent)}
.mh i{display:block;font-style:normal;font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:7px}.mh h3{margin:0;font-size:19px;letter-spacing:.02em}.mh p{margin:5px 0 0;color:var(--mut);font-size:12.5px}
.mx{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--ln2);background:var(--pn);color:var(--mut);cursor:pointer;font-size:16px;line-height:1;transition:all .2s}.mx:hover{color:var(--tx);border-color:rgba(255,255,255,.32);transform:rotate(90deg)}
.mbd{display:grid;gap:20px;padding:20px 26px 24px;overflow:auto}
.mf{display:flex;align-items:center;gap:14px;padding:14px 26px;border-top:1px solid var(--ln);background:rgba(0,0,0,.24)}.mf small{color:var(--mut);font-size:12px}.mf div{display:flex;gap:8px;margin-left:auto}
.gl{display:flex;align-items:center;gap:12px;margin-bottom:10px;color:var(--mut);font-size:11.5px;letter-spacing:.24em}.gl::after{content:"";flex:1;height:1px;background:var(--ln)}
.fb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid var(--ln2);border-radius:14px;overflow:hidden;background:var(--ln2)}
.fd{position:relative;min-width:0;padding:11px 15px 10px;background:#151912;transition:background .18s}.fd.w{grid-column:1/-1}.fd:hover{background:#181d13}.fd:focus-within{background:#1b2213}
.fd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .25s}.fd:focus-within::after{transform:none}
.fd label{margin:0 0 3px;font-size:11px;letter-spacing:.16em}
.fd input,.fd select{width:100%;height:30px;border:0;border-radius:0;padding:0;background-color:transparent;font-size:14px}
.fd input:focus,.fd select:focus{border:0;box-shadow:none}
.fd select{padding-right:18px;background-position:calc(100% - 8px) 10px,calc(100% - 3px) 10px}
.fd b{display:block;font-size:14px;line-height:26px;overflow-wrap:anywhere}
.fd .u{position:absolute;right:15px;bottom:12px;color:var(--mut);font-size:12.5px}.fd:has(.u) input{padding-right:28px}
.fd .sw2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;height:26px;font-size:14px;letter-spacing:0;color:var(--tx);cursor:pointer}
.sw2 input{position:absolute;opacity:0;width:1px;height:1px}
.sw2 s{position:relative;flex:none;width:36px;height:20px;border-radius:99px;background:rgba(255,255,255,.16);text-decoration:none;transition:background .2s}.sw2 s::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#cfd6c4;transition:all .2s}
.sw2 input:checked+s{background:var(--ac)}.sw2 input:checked+s::after{left:19px;background:var(--ink)}.sw2 input:focus-visible+s{outline:2px solid var(--ac);outline-offset:2px}
.pw{display:flex;gap:4px;margin-top:5px}.pw i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .2s}.pw i.on{background:var(--ac)}
.st{display:flex;align-items:center;gap:12px}.st[hidden]{display:none}.st span{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px}.st b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--ln2);font-size:12px}.st .on{color:var(--tx)}.st .on b{background:var(--ac);border-color:var(--ac);color:var(--ink)}.st .ok b{border-color:var(--ac);color:var(--ac)}.st hr{flex:1;height:1px;margin:0;border:0;background:var(--ln2)}
.nt{padding:12px 15px;border-radius:12px;border:1px solid rgba(255,185,56,.24);background:rgba(255,185,56,.08);color:var(--am);font-size:13px;line-height:1.65}.md.dg .nt{border-color:rgba(255,107,90,.28);background:rgba(255,107,90,.08);color:var(--dn)}

.mb.p{background:var(--ac);border-color:var(--ac);color:var(--ink)}.mb.p:hover{background:#e6ff4d}.mb.dg{background:var(--dn);border-color:var(--dn);color:#2a0905}.mb.dg:hover{background:#ff8473}.mb:disabled{opacity:.4;cursor:not-allowed}

      <form id="cn-create-subadmin" class="cn-form" hidden autocomplete="off">
        <h3>创建子账户</h3><label>子账户邮箱<input name="email" type="email" required autocomplete="off"></label>
        <label>临时密码（至少 12 位）<input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
        <button type="submit" class="btn p">创建子账户</button>
        <p class="mut" id="cn-subadmin-status" role="status"></p>
        <pre id="cn-subadmin-credentials" class="cn-secret" hidden></pre>
      </form>
    </div>
  </section>
  <section class="pg grid" id="p-appr" hidden><div class="pn c12"><div class="ph">申请审批</div>
    <div class="pb"><p class="mut">当前系统未提供申请审批数据接口，这一页面不显示未同步记录。</p></div>
  </div></section>
  <section class="pg grid" id="p-fund" hidden><div class="pn c12"><div class="ph">资金记录</div>
    <div class="pb"><p class="mut">当前系统未提供资金申请查询接口，不能根据页面样例推算到账或付款。</p></div>
  </div></section>
  <section class="pg grid" id="p-cat" hidden><div class="pn c12"><div class="ph"><span>证券资料管理</span><button class="btn" id="cn-refresh-listings" type="button">刷新</button></div>
    <div class="cn-table-scroll"><table><thead><tr><th>类型</th><th>市场 / 代码</th><th>名称</th><th>状态</th><th>操作</th></tr></thead><tbody id="cn-listing-rows"></tbody></table></div>
    <form id="cn-create-listing" class="cn-form" hidden>
      <h3>新增证券资料</h3>
      <label>类型<select name="itemType"><option value="STOCK">股票</option><option value="FUND">基金</option><option value="IPO">IPO</option></select></label>
      <label>市场<select name="market"><option value="US">美国</option><option value="HK">香港</option><option value="CN">中国内地</option><option value="MY">马来西亚</option></select></label>
      <label>证券代码<input name="symbol" pattern="[A-Za-z0-9.-]{1,24}" required></label>
      <label>名称<input name="name" maxlength="120" required></label>
      <label>状态<select name="status"><option value="DRAFT">草稿</option><option value="PUBLISHED">已发布</option></select></label>
      <button type="submit" class="btn p">保存证券资料</button><p id="cn-listing-status" class="mut" role="status"></p>
    </form>
  </div></section>
</main>
<style id="cn-api-style">
.cn-backend{padding-bottom:30px}.cn-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px}
.cn-tile{background:rgba(255,255,255,.035);border:1px solid var(--ln);border-radius:12px;display:flex;flex-direction:column;gap:10px;padding:24px}
.cn-tile strong{font-size:30px;color:var(--ac)}.cn-table-scroll{width:100%;overflow-x:auto}.cn-table-scroll table{width:100%}
.cn-form{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;border-top:1px solid var(--ln);padding:18px}
.cn-form h3{flex-basis:100%;margin:0;font-size:16px}.cn-form label{display:flex;flex-direction:column;gap:5px}
.cn-form input,.cn-form select{min-width:175px;padding:9px;border-radius:8px;border:1px solid var(--ln2);background:#121510;color:var(--tx)}
.cn-form button{margin:0}.cn-secret{flex-basis:100%;white-space:pre-wrap;overflow-wrap:anywhere;background:#141810;padding:12px;border-radius:10px}
.cn-empty td{color:var(--mut);padding:14px}.cn-action{margin:0 3px}.cn-status{color:var(--am)}
@media(max-width:780px){.cn-summary{grid-template-columns:1fr}.cn-form label{width:100%}.cn-form input{width:100%}.cn-backend{padding:0 6px}}
</style>
<script type="module" src="/cn-admin-bridge.mjs"></script>
</body></html>
