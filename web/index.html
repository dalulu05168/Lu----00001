<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Stock Platform | 交易终端</title><link rel="stylesheet" href="./styles.css"></head>
<body><header><div class="brand">GSP <span>GLOBAL MARKETS</span></div><div class="status">开发版 · 未连接实时行情</div></header>
<div class="authbar"><form id="authForm"><input id="email" type="email" placeholder="邮箱" required><input id="password" type="password" placeholder="密码（至少12位）" required><button type="submit" value="login">登录</button><button type="submit" value="register">注册并登录</button></form><button type="button" id="logout">退出登录</button><span id="authFeedback" role="status"></span></div><main><aside><h2>市场</h2><nav id="markets"></nav><h2>股票搜索</h2><input id="search" placeholder="输入代码或名称" aria-label="搜索股票"><div id="symbols"></div></aside>
<section class="workspace"><div class="headline"><div><div class="eyebrow" id="marketLabel"></div><h1 id="symbolTitle"></h1><p id="symbolName"></p></div><div class="quote"><strong id="quotePrice"></strong><small>仅供界面演示 · 非实时行情</small></div></div>
<div class="chart"><div class="chart-label">价格图表</div><div class="chart-empty">行情服务尚未接入，暂不展示价格走势</div></div>
<div class="panels"><section class="panel"><h2>内部订单</h2><p class="notice">订单仅在本平台内部记录，不会发送至证券交易所或券商；所示持仓和资金不代表真实证券或可提现资产。</p><form id="orderForm"><label>方向<select id="side"><option value="BUY">买入</option><option value="SELL">卖出</option></select></label><label>数量<input id="quantity" type="number" min="1" step="1" value="1" required></label><p class="subtle">价格由服务器验证，行情未连接时禁止提交订单。</p><button type="submit">提交内部订单</button></form><p id="feedback" role="status"></p></section>
<section class="panel"><h2>账户概览</h2><div class="balance">USD <strong id="cash"></strong></div><p class="subtle">内部账面余额，不可提现</p><h3>持仓</h3><div id="positions"></div></section></div>
<section class="panel orders"><h2>订单记录</h2><div id="orders"></div></section></section></main><script type="module" src="./app.mjs"></script></body></html>
