function updateCrosshair(e){
 const plot=e.target.closest('.plot-wrap');if(!plot||!state.crosshair)return;
 const canvas=plot.querySelector('canvas.nx-canvas'),cross=plot.querySelector('.market-crosshair');
 if(!canvas||!cross)return;
 const g=chartMeta.get(canvas);if(!g)return;
 const r=canvas.getBoundingClientRect();let x=e.clientX-r.left,y=e.clientY-r.top;
 if(x<g.left||x>g.graphR||y<g.top||y>g.priceBottom){cross.classList.remove('active');return}
 const i=Math.min(g.data.length-1,Math.max(0,Math.round((x-g.left)/g.graphW*g.data.length-.5)));
 const indexX=g.pX(i),bar=g.data[i];
 const price=g.hi-(y-g.top)/(g.priceBottom-g.top)*g.span;
 cross.style.setProperty('--mx',(indexX/g.w*100).toFixed(5)+'%');
 cross.style.setProperty('--my',(y/g.h*100).toFixed(5)+'%');
 cross.querySelector('.cross-price-tag').textContent=fmt(price);
 cross.querySelector('.cross-time-tag').textContent=`${String(9+Math.floor(i/4)%8).padStart(2,'0')}:${String((i%4)*15).padStart(2,'0')} · DEMO`;
 cross.querySelector('.cross-ohlc-tag').textContent=`${canvas.dataset.symbol} · #${i+1}  O ${fmt(bar.o)}  H ${fmt(bar.h)}  L ${fmt(bar.l)}  C ${fmt(bar.c)}  V ${Math.round(bar.v)} · SIMULATED`;
 cross.classList.add('active');
}

-sub">This preview does not connect to authentication or make configuration changes.</div>${table(['Policy','Example Status'],[['Two-factor authentication',pill('Recommended','review')],['Session restrictions',pill('Enabled','active')],['Role-based access',pill('Enabled','active')]])}</section><section class="panel"><div class="panel-heading"><h2>Session & Security</h2></div>${flow()}</section></div>`}
return `<div class="role-container">${appTop(true)}<div class="admin-layout"><aside class="admin-sidebar"><div class="sidebar-scroll">${nav.map(([group,links])=>`<div class="menu-group"><div class="menu-heading">${group}</div>${links.map(([p,i,t])=>`<button data-page="${p}" class="navitem ${state.page===p?'active':''}">${ico(i,15)}<span>${t}</span>${p==='approvals'?'<span class="count">29</span>':''}</button>`).join('')}</div>`).join('')}</div><div class="sidebar-profile"><span class="avatar">NP</span><div><strong style="font-weight:700">${master?'Platform Owner':'Desk Operator'}</strong><small>${master?'Global Administrator':'Operations Member'}</small></div></div></aside><main class="admin-area"><div class="breadcrumbs">Home / ${master?'Platform Management':'Financial Management'} / <strong>${title}</strong></div><div class="admin-titleline"><div class="admin-title"><h1>${title}</h1><p>${master?'Global administration workspace':'Desk operations & client workflows'} &nbsp;·&nbsp; All figures are simulated</p></div><div class="admin-actions"><button class="btn-subtle" data-action="export">${ico('download',12)} &nbsp;Export Sample</button><button class="btn-purple" data-action="create">${ico('plus',12)} &nbsp;${master?'Create Sub-account':'New Request'}</button></div></div><div class="adm-tabs"><button class="${state.page==='overview'?'on':''}" data-page="overview">Overview</button><button data-page="${master?'accounts':'approvals'}" class="${['accounts','approvals'].includes(state.page)?'on':''}">${master?'Accounts & Permissions':'Approval Workflows'}</button><button data-page="${master?'risk':'accounts'}" class="${['risk','clients'].includes(state.page)?'on':''}">${master?'Risk Operations':'Client Management'}</button></div>${body}<div class="foot-note" style="padding:17px 0 4px">${ico('shield',12)} CN CAPITAL · Admin preview only · Zero live financial data · No server connection</div></main></div></div>`}
function login(){return `<div class="login-screen"><section class="login-art"><div class="orbit"><span class="orbit-node"></span></div><div class="login-brand"><div class="pv-logo">N</div> CN <span>Capital</span></div><div><h1>Built for<br/><em>every market.</em><br/>Designed for<br/>clarity.</h1><p>One financial platform. Three distinct workspaces. Refined trading tools, transparent workflows and role-based operations.</p><span class="pv-tag" style="display:inline-block;margin-top:12px">DESIGN PREVIEW · NOT A LIVE SERVICE</span></div><div class="login-foot"><span>© Nuvexa Pro</span><span>Privacy by design</span><span>Demo prototype v1</span></div></section><section class="login-right"><form class="login-card" id="loginForm"><div style="color:#8b9fe5;letter-spacing:1.8px;font-size:10px;font-weight:800;margin-bottom:15px">SECURE WORKSPACE</div><h2>Welcome back</h2><p>Select a workspace to preview the sign-in experience. This file does not authenticate or collect login credentials.</p><div class="role-choices">${[['client','Client'],['ops','Operations'],['master','Master']].map(([a,b])=>`<button type="button" data-login-role="${a}" class="${state.loginRole===a?'selected':''}">${b}</button>`).join('')}</div><div class="field"><label>Work email</label><input type="text" id="demoEmail" autocomplete="off" placeholder="example@yourcompany.com"/></div><div class="field" style="margin-top:18px"><label>Password</label><input type="password" autocomplete="off" id="demoPassword" placeholder="••••••••••"/></div><div style="display:flex;justify-content:space-between;color:#91a6c4;font-size:10px;margin:15px 0 20px"><label><input type="checkbox"/> Remember this device</label><span>Forgot password?</span></div><button type="submit" class="action-primary">Preview ${state.loginRole==='master'?'Master':state.loginRole==='ops'?'Operations':'Client'} Workspace &nbsp;→</button><div class="login-caption">Demo only · no details submitted · no account created</div></form></section></div>`}
let toastTimer;
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function render(){if(!['client','ops','master','login'].includes(state.role))state.role='client';$$('[data-role]').forEach(el=>{if(el.closest('#roleSwitch'))el.classList.toggle('active',el.dataset.role===state.role)});$('#app').innerHTML=state.role==='client'?terminal():state.role==='login'?login():admin();setupNxCharts();}
function updateTotal(){const qty=Number($('#orderQty')?.value||0),p=state.orderType==='MARKET'?(market.find(x=>x.s===state.symbol)||market[0]).p:Number($('#orderLimit')?.value||0);const el=$('#orderTotal');if(el)el.textContent='$'+fmt(Math.max(0,qty*p));}
function modal(title,body,buttonText='Close'){document.getElementById('overlay').innerHTML=`<div class="modal-bg" data-close="true"><div class="modal-box" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="modal-close" data-close="true">×</button></div><div class="modal-body">${body}</div><div class="modal-footer"><button class="action-primary" data-close="true">${buttonText}</button></div></div></div>`;}
function csv(){let data=state.role==='master'?masterAccounts:state.role==='ops'?opsDemoRows:market.map(x=>[x.s,x.n,x.p,x.chg]);const lines=data.map(r=>r.map(v=>'"'+String(v).replace(/<[^>]*>/g,'').replaceAll('"','""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+lines],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='nuvexa-'+state.role+'-DEMO.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出示例 CSV（仅演示数据）。')}
document.addEventListener('click',e=>{let t=e.target.closest('button,[data-close]');if(!t)return;if(t.closest('#roleSwitch')&&t.dataset.role){state.role=t.dataset.role;state.page='overview';state.search='';render();return}if(t.dataset.role){state.role=t.dataset.role;state.page='overview';render();return}if(t.dataset.close){$('#overlay').innerHTML='';return}if(t.dataset.page){state.page=t.dataset.page;render();return}if(t.dataset.symbol){state.symbol=t.dataset.symbol;state.limit=market.find(x=>x.s===state.symbol).p;state.page='trade';render();return}if(t.dataset.period){state.period=t.dataset.period;render();return}if(t.dataset.order){state.order=t.dataset.order;render();return}if(t.dataset.loginRole){state.loginRole=t.dataset.loginRole;render();return}if(t.dataset.demoPeriod){state.demoPeriod=t.dataset.demoPeriod;render();return}if(t.dataset.action){let a=t.dataset.action;if(a==='crosshair'){state.crosshair=!state.crosshair;render();toast(state.crosshair?'十字线已开启：移入 K 线查看对应 OHLC 与坐标。':'十字线已关闭。');return}if(a==='review'){let s=market.find(x=>x.s===state.symbol)||market[0],amount=state.qty*(state.orderType==='MARKET'?s.p:state.limit);if(!(Number.isFinite(amount)&&amount>0&&Number.isInteger(state.qty)&&state.qty>0)){toast('请输入有效的数量与委托价格。');return}modal('Order Preview · '+state.order,`<div style="padding:8px 0">${state.order} <strong style="color:#e8f4ff">${state.qty} ${s.s}</strong> at ${state.orderType==='MARKET'?'Market':('$'+fmt(state.limit))}.</div><div class="modal-total"><span>Illustrative notional</span><strong>$${fmt(amount)}</strong></div><p>这是一个 <b>HTML 原型</b>：没有账户、资金或真实下单接口。此按钮不会生成交易记录。</p>`,'明白，返回预览');return}if(a==='export'){csv();return}if(a==='create'){modal('设计预览 · 新建流程',`这是“${state.role==='master'?'新增子账户':'新建申请'}”的预览入口。实际表单、审批规则和数据库写入将在你确认视觉设计后再接入。`);return}if(a==='notification'){modal('Notifications','目前没有接入通知服务器。消息中心仅显示原型布局。');return}toast('这是设计交互预览；真实业务能力尚未连接。');}}
);
document.addEventListener('input',e=>{if(e.target.id==='watchSearch'){state.watchQuery=e.target.value;const l=$('#watchList');if(l){const rows=market.filter(x=>(x.s+x.n).toLowerCase().includes(state.watchQuery.toLowerCase()));l.innerHTML=rows.map(w=>`<button class="watch-item ${state.symbol===w.s?'active':''}" data-symbol="${w.s}"><div><strong>${w.s}</strong><small>${w.n}</small></div><div class="quote-value"><strong>${fmt(w.p)}</strong><small class="${w.chg>=0?'green':'red'}">${w.chg>0?'+':''}${fmt(w.chg)}</small></div></button>`).join('')||'<div class="empty-search">No instruments found</div>';}return}if(e.target.id==='orderQty'){state.qty=Number(e.target.value);updateTotal();return}if(e.target.id==='orderLimit'){state.limit=Number(e.target.value);updateTotal();return}if(e.target.id==='globalSearch'){const v=e.target.value.trim().toUpperCase();if(state.role==='client'&&market.some(x=>x.s===v)){state.symbol=v;state.limit=market.find(x=>x.s===v).p;state.page='trade';render()}}});
document.addEventListener('change',e=>{if(e.target.id==='orderType'){state.orderType=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();state.role=state.loginRole;state.page='overview';render();toast('已经切换到设计预览；没有发生真实登录。')}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch')?.focus()}if(e.key==='Escape')$('#overlay').innerHTML=''});
render();
})();
</script>
