services:
  - type: web
    name: cn-capital-phone-qa
    runtime: node
    region: singapore
    plan: free
    branch: ui/cn-capital-phone-login
    autoDeployTrigger: off
    buildCommand: npm install --omit=dev
    startCommand: npm run migrate && node src/server.mjs
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cn-capital-phone-qa-db
          property: connectionString
      - key: ADMIN_MASTER_PHONE
        sync: false
      - key: ADMIN_TOTP_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: CUSTOMER_DATA_KEY
        generateValue: true
databases:
  - name: cn-capital-phone-qa-db
    region: singapore
    plan: free
    ipAllowList: []
