# Separate static marketing preview; no access to the customer trading portal or QA database.
services:
  - type: web
    runtime: static
    name: cn-capital-site-preview
    branch: deploy/cn-capital-render-static
    buildCommand: node check.mjs && node --check main.js && node build-static.mjs
    staticPublishPath: dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
# Deliberately no custom domain. Deploy and verify preview first,
# then bind about.nuvexapro.com only after DNS ownership and approvals.
