# Existing Render static site, now serving the latest CN Capital stage2 UI.
services:
  - type: web
    runtime: static
    name: cn-capital-site-preview
    branch: deploy/cn-capital-render-static
    buildCommand: node check.mjs && node --check main.js && node build-static.mjs
    staticPublishPath: dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
