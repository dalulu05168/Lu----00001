# Independent QA preview only. DO NOT attach the original production database.
services:
  - type: web
    name: global-stock-qa-preview
    runtime: node
    region: singapore
    plan: free
    branch: dev/restore-four-role-platform-20261103
    autoDeployTrigger: checksPass
    buildCommand: npm install --omit=dev
    startCommand: node src/server.mjs
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_MASTER_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: CUSTOMER_DATA_KEY
        generateValue: true
      - key: ADMIN_TOTP_KEY
        generateValue: true

# Future custom domains after QA rollout is approved:
# domains:
#   - nuvexapro.com
#   - admin.nuvexapro.com
# Intentionally not activated here. A Blueprint sync may add the domain,
# change billing after the free custom-domain allowance, and affect live DNS.
# Add in Render Settings > Custom Domains only after checking plan/quota.
