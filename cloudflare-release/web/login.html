<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>CN Capital</title>
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#e8c27a;--gold2:#f3d9a6;--cyan:#45e0d6;--ink:#f3eede;--mut:rgba(226,224,214,.55);--line:rgba(180,205,255,.14)}
html,body{height:100%}
body{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(130% 95% at 18% 10%,#15306a 0%,#0b1838 42%,#070b18 72%),radial-gradient(120% 100% at 88% 94%,#5a2d0f 0%,rgba(90,45,15,0) 50%),#05060a;overflow:hidden}

/* ===== 背景层 ===== */
.aur{position:fixed;inset:-10%;z-index:0;pointer-events:none;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.blob{position:absolute;border-radius:50%;filter:blur(70px);mix-blend-mode:screen;opacity:.9}
.b1{width:320px;height:320px;top:6%;right:2%;background:radial-gradient(circle,rgba(69,224,214,.32),transparent 70%);animation:fl1 14s ease-in-out infinite alternate}
.b2{width:380px;height:380px;bottom:0;left:-4%;background:radial-gradient(circle,rgba(232,194,122,.28),transparent 70%);animation:fl2 17s ease-in-out infinite alternate}
.b3{width:300px;height:300px;top:38%;left:30%;background:radial-gradient(circle,rgba(70,110,255,.26),transparent 70%);animation:fl3 20s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate(-60px,80px) scale(1.15)}}
@keyframes fl2{to{transform:translate(70px,-60px) scale(1.1)}}
@keyframes fl3{to{transform:translate(-80px,-40px) scale(.9)}}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(180,205,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(180,205,255,.05) 1px,transparent 1px);background-size:42px 42px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 28%,#000 0,transparent 75%);mask-image:radial-gradient(ellipse 80% 60% at 50% 28%,#000 0,transparent 75%)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.vig{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(2,4,10,.55) 100%)}

/* ===== 开场 ===== */
#cnsplash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(135% 100% at 16% 12%,#1b3a7a 0%,#0c1b40 40%,#070b18 70%),radial-gradient(120% 100% at 90% 92%,#6a3410 0%,rgba(106,52,16,0) 52%),#05060a;transition:opacity .9s ease,transform .9s ease,filter .9s ease}
#cnsplash.cn-off{opacity:0;transform:scale(1.08);filter:blur(6px);pointer-events:none}
#cnsplash.cn-gone{display:none}
#cnsky{position:absolute;inset:0;width:100%;height:100%}
.cn-core{position:relative;z-index:2;text-align:center;transform:translateY(-3%)}
.cn-stage{position:relative;display:inline-block;width:min(42vw,152px);height:min(42vw,152px)}
.cn-wave{position:absolute;inset:0;border-radius:30px;border:1px solid rgba(232,194,122,.55);opacity:0;animation:cnwave 2.6s 1s ease-out infinite}
.cn-wave.w2{animation-delay:1.7s;border-color:rgba(69,224,214,.5)}
@keyframes cnwave{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.3)}}
.cn-ring{position:absolute;inset:-12px;border-radius:42px;padding:1.5px;opacity:0;background:conic-gradient(from var(--ang),rgba(180,205,255,.1) 0 55%,rgba(232,194,122,.95) 75%,rgba(69,224,214,.95) 92%,rgba(180,205,255,.1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:cnfade .8s .5s forwards,ang 3s linear infinite}
@keyframes cnfade{to{opacity:1}}
.cn-badge{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:30px;background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.015));border:1px solid rgba(180,205,255,.28);box-shadow:0 10px 60px rgba(40,90,180,.5),0 0 0 1px rgba(255,255,255,.04) inset,inset 0 0 40px rgba(120,170,255,.14);opacity:0;transform:scale(.62) rotate(-6deg);animation:cnpop 1.15s .1s cubic-bezier(.17,.8,.26,1) forwards}
.cn-badge::after{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sweep 2.4s 1.1s ease-in-out infinite}
@keyframes sweep{0%{left:-60%}60%,100%{left:140%}}
.cn-mk{width:62%;height:62%;filter:drop-shadow(0 0 14px rgba(150,200,255,.6))}
.cn-mk .p1{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.3s .4s ease forwards}
.cn-mk .p2{stroke-dasharray:140;stroke-dashoffset:140;animation:draw 1.1s .9s ease forwards}
.cn-mk .dot{opacity:0;animation:cnfade .4s 1.7s forwards,pulse 1.6s 2s ease-in-out infinite;transform-origin:64.5px 30.5px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{transform:scale(1.7);opacity:.6}}
@keyframes cnpop{0%{opacity:0;transform:scale(.62) rotate(-6deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
.cn-word{margin-top:26px;font-size:clamp(17px,4.6vw,26px);font-weight:600;letter-spacing:.44em;padding-left:.44em;opacity:0;transform:translateY(10px);animation:cnrise .9s .72s ease forwards;background:linear-gradient(100deg,#f3eede 20%,#ffe9bf 45%,#f3eede 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 20px rgba(232,194,122,.4))}
.cn-word{animation:cnrise .9s .72s ease forwards,shine 3s 1.6s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.cn-sub{margin-top:11px;font-size:clamp(9px,2.2vw,12px);letter-spacing:.52em;padding-left:.52em;color:#e8c27a;opacity:0;animation:cnrise .9s 1.02s ease forwards}
@keyframes cnrise{to{opacity:1;transform:none}}
.cn-bar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);width:min(46vw,180px);height:2px;margin-left:calc(min(46vw,180px) / -2);border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;z-index:2}
.cn-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--cyan));box-shadow:0 0 10px var(--gold);animation:bar 2.4s .1s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes bar{to{width:100%}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 登录页 ===== */
.lg{position:relative;z-index:1;height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 46px) 24px calc(env(safe-area-inset-bottom,0px) + 20px);opacity:0;transition:opacity .7s ease}
.lg.show{opacity:1}
.lg>*{opacity:0;transform:translateY(18px)}
.lg.show>*{animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
.lg.show>.lang{animation-delay:.05s}.lg.show>.hero{animation-delay:.15s}.lg.show>.card{animation-delay:.3s}.lg.show>.foot{animation-delay:.55s}
@keyframes up{to{opacity:1;transform:none}}
.lang{align-self:flex-end;display:flex;gap:2px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:3px;font-size:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lang button{border:0;background:transparent;color:var(--mut);padding:5px 13px;border-radius:999px;font:inherit;cursor:pointer;transition:.25s}
.lang button.on{background:rgba(232,194,122,.18);color:var(--gold2);box-shadow:0 0 14px rgba(232,194,122,.2)}
.hero{margin:auto auto 22px;padding-top:14px;text-align:center}
.badge{position:relative;display:inline-flex;align-items:center;justify-content:center;width:90px;height:90px;border-radius:24px;background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.02));border:1px solid rgba(180,205,255,.26);box-shadow:0 14px 44px rgba(40,90,180,.38),inset 0 0 30px rgba(120,170,255,.12);animation:float 5s ease-in-out infinite}
.badge::before{content:"";position:absolute;inset:-8px;border-radius:32px;padding:1.5px;background:conic-gradient(from var(--ang),rgba(180,205,255,.12) 0 55%,rgba(232,194,122,.95) 76%,rgba(69,224,214,.95) 90%,rgba(180,205,255,.12));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ang 6s linear infinite;pointer-events:none}
.badge::after{content:"";position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);background-size:250% 100%;animation:glint 4.5s ease-in-out infinite}
@keyframes glint{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
@keyframes float{50%{transform:translateY(-6px)}}
.badge svg{width:60%;height:60%;filter:drop-shadow(0 0 10px rgba(150,200,255,.55));position:relative;z-index:1}
.hero h1{margin-top:22px;font-size:24px;font-weight:600;letter-spacing:.3em;padding-left:.3em;background:linear-gradient(100deg,#fff 10%,var(--gold2) 50%,#fff 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
.hero p{margin-top:9px;font-size:11px;letter-spacing:.42em;padding-left:.42em;color:var(--gold)}

.card{position:relative;max-width:420px;width:100%;margin:0 auto;padding:26px 20px 20px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang),rgba(180,205,255,.14) 0 55%,rgba(232,194,122,.95) 75%,rgba(69,224,214,.95) 88%,rgba(180,205,255,.14) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ang 7s linear infinite;pointer-events:none}
@keyframes ang{to{--ang:360deg}}
.card.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--mut);margin:0 0 7px 3px;transition:color .2s}
.fld:focus-within label{color:var(--gold2)}
.inp{position:relative;display:flex;align-items:center;background:rgba(8,14,32,.42);border:1px solid var(--line);border-radius:14px;transition:border-color .25s,box-shadow .25s,background .25s;overflow:hidden}
.inp::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:linear-gradient(90deg,var(--gold),var(--cyan));transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.inp:focus-within{border-color:rgba(232,194,122,.55);background:rgba(10,18,40,.6);box-shadow:0 0 0 3px rgba(232,194,122,.12),0 8px 28px rgba(232,194,122,.1)}
.inp:focus-within::after{transform:scaleX(1)}
.inp.bad{border-color:rgba(255,120,120,.6)}
.inp .pfx{padding:0 12px;color:var(--mut);display:flex;transition:color .25s,transform .25s}
.inp:focus-within .pfx{color:var(--gold);transform:scale(1.1)}
.inp .pfx svg{width:18px;height:18px}
.inp input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px/1 inherit;padding:15px 12px 15px 0;outline:none}
.inp input::placeholder{color:rgba(226,224,214,.32)}
.inp input:-webkit-autofill{-webkit-text-fill-color:var(--ink);transition:background-color 9999s}
.eye{background:0;border:0;color:var(--mut);padding:0 14px;cursor:pointer;display:flex;transition:color .2s}
.eye svg{width:19px;height:19px}
.rowx{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 20px;font-size:13px}
.rem{display:flex;align-items:center;gap:8px;color:var(--mut);cursor:pointer;user-select:none}
.rem i{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.rem.on i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(232,194,122,.45)}
.rem.on i::after{content:"";width:9px;height:5px;border:2px solid #1a1206;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.rem input{display:none}
.lnk{color:var(--gold);text-decoration:none;position:relative}
.lnk::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;transform:scaleX(0);transition:transform .3s}
.lnk:active::after{transform:scaleX(1)}
.btn{position:relative;overflow:hidden;width:100%;border:0;border-radius:14px;padding:16px;font:600 16px/1 inherit;letter-spacing:.08em;color:#1a1206;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#d9a95a);background-size:200% 100%;cursor:pointer;box-shadow:0 10px 30px rgba(232,194,122,.32),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s,opacity .2s,background-position .6s;animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 12px 40px rgba(232,194,122,.5),inset 0 1px 0 rgba(255,255,255,.5)}}
.btn::before{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-22deg);animation:sweep2 3.6s ease-in-out infinite}
@keyframes sweep2{0%{left:-70%}45%,100%{left:150%}}
.btn:active{transform:translateY(1px) scale(.992)}
.btn:disabled{opacity:.85;cursor:default}
.btn>span{position:relative;z-index:1}
.btn .sp{display:none;width:17px;height:17px;border:2px solid rgba(26,18,6,.3);border-top-color:#1a1206;border-radius:50%;margin-right:9px;vertical-align:-3px;animation:spin .7s linear infinite}
.btn.load .sp{display:inline-block}
.btn.done{background:linear-gradient(135deg,#8ff0d8,var(--cyan));box-shadow:0 10px 34px rgba(69,224,214,.45)}
.btn .ck{display:none;width:18px;height:18px;margin-right:8px;vertical-align:-3px}
.btn.done .ck{display:inline-block}
.btn.done .ck path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s forwards}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.div{display:flex;align-items:center;gap:14px;color:var(--mut);font-size:12px;margin:20px 0}
.div::before,.div::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.alt{display:flex;gap:12px}
.alt button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--ink);font:14px inherit;cursor:pointer;transition:.2s}
.alt button:active{background:rgba(232,194,122,.12);border-color:rgba(232,194,122,.4);transform:scale(.98)}
.alt button svg{width:18px;height:18px;color:var(--gold)}
.foot{text-align:center;color:rgba(226,224,214,.4);font-size:11px;margin:22px auto 0;line-height:1.7;padding-bottom:4px}
.foot .sec{display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;color:rgba(69,224,214,.75)}
.foot .sec i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse2 1.8s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.35}}
.err{color:#ff8e8e;font-size:12px;margin:-8px 2px 12px;min-height:1px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%) translateY(20px);background:rgba(18,26,44,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(232,194,122,.25);color:var(--ink);padding:12px 20px;border-radius:12px;font-size:14px;z-index:100000;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%)}
.geo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;animation:cnfade 1.4s 2.5s forwards}
.geo *{fill:none;stroke-width:1;vector-effect:non-scaling-stroke}
.g-spin{transform-box:view-box;transform-origin:200px 130px}
.g-spin.a{animation:spin 90s linear infinite}
.g-spin.b{animation:spin 40s linear infinite reverse}
.g-spin.c{animation:spin 70s linear infinite}
.g-spin.d{animation:spin 45s linear infinite reverse}
.geo .nd{fill:var(--gold);stroke:none;filter:drop-shadow(0 0 4px var(--gold));animation:pulse2 2.4s ease-in-out infinite}
.geo .nd.d2{fill:var(--cyan);animation-delay:.8s}.geo .nd.d3{fill:var(--cyan);animation-delay:1.6s}
.geo .ray{stroke-dasharray:1000;stroke-dashoffset:1000;animation:rdraw 2.6s cubic-bezier(.3,.6,.2,1) forwards}
.geo .r1{animation-delay:2.7s}.geo .r2{animation-delay:2.9s}.geo .r3{animation-delay:3.1s}.geo .r4{animation-delay:3.3s}.geo .r5{animation-delay:3.5s}
@keyframes rdraw{to{stroke-dashoffset:0}}
.geo .plus{stroke:rgba(232,194,122,.35);stroke-linecap:round}
.scan{position:fixed;left:0;right:0;top:0;height:150px;z-index:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(69,224,214,.05) 70%,rgba(69,224,214,.16) 99%,transparent);animation:scan 8s 3s linear infinite;transform:translateY(-170px)}
@keyframes scan{to{transform:translateY(110vh)}}
.cr{position:fixed;width:20px;height:20px;z-index:0;pointer-events:none;border:0 solid rgba(232,194,122,.5);opacity:0;animation:cnfade 1s 3s forwards}
.cr.tl{top:calc(env(safe-area-inset-top,0px) + 40px);left:10px;border-width:1px 0 0 1px}
.cr.tr{top:calc(env(safe-area-inset-top,0px) + 40px);right:10px;border-width:1px 1px 0 0}
.cr.bl{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;border-width:0 0 1px 1px}
.cr.br{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);right:10px;border-width:0 1px 1px 0}
.tick{position:fixed;top:0;left:0;right:0;z-index:3;height:calc(env(safe-area-inset-top,0px) + 32px);padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;overflow:hidden;background:rgba(6,10,24,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);opacity:0;animation:cnfade .8s 2.6s forwards}
.tk-in{display:flex;white-space:nowrap;animation:mq 60s linear infinite;will-change:transform}
@keyframes mq{to{transform:translateX(-50%)}}
.tk{display:inline-flex;align-items:center;gap:7px;padding:0 16px;font-size:12px;border-right:1px solid rgba(180,205,255,.08)}
.tk b{font-weight:500;color:rgba(226,224,214,.85)}
.tk small{color:var(--mut);font-size:10px;letter-spacing:.05em}
.tk em,.tk u{font-style:normal;text-decoration:none;font-variant-numeric:tabular-nums}
.tk em{color:var(--ink);padding:1px 4px;border-radius:4px}
.tk .up{color:#ff5a5f}.tk .dn{color:#2fd49a}
.tk em.f-up{animation:fup .8s}.tk em.f-dn{animation:fdn .8s}
@keyframes fup{0%{background:rgba(255,90,95,.4)}100%{background:transparent}}
@keyframes fdn{0%{background:rgba(47,212,154,.4)}100%{background:transparent}}
.mst{position:absolute;left:24px;top:calc(env(safe-area-inset-top,0px) + 50px);display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11px;color:var(--mut)}
.mst i{width:6px;height:6px;border-radius:50%;background:#7d869a}
.mst.on i{background:#2fd49a;box-shadow:0 0 8px #2fd49a;animation:pulse2 1.6s ease-in-out infinite}
.mst.ext i{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.mst b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.pn[hidden]{display:none}
.pn.in{animation:pnin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pnin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.str{display:flex;gap:5px;margin:-6px 3px 12px}
.str i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.1);transition:background .3s,box-shadow .3s}
.str i.s1{background:#ff8e8e}.str i.s2{background:var(--gold)}.str i.s3{background:var(--cyan);box-shadow:0 0 8px rgba(69,224,214,.6)}
.inv{letter-spacing:.14em;text-transform:uppercase}.inv::placeholder{letter-spacing:0;text-transform:none}
.back{display:block;width:100%;margin-top:18px;background:0;border:0;color:var(--gold);font:13px inherit;cursor:pointer}
