<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuvexa · 运营工作台</title><!--ADMIN_NEXT_STYLE--><!--ADMIN_NEXT_AUTH--></head><body><div class="app-shell"><aside class="sidebar">
  <div class="sidebar-top">
    <a class="brand" href="/admin" aria-label="Nuvexa 工作台"><img src="/logo.png" alt="Nuvexa" class="platform-logo"></a>
    <button id="sidebar-collapse" class="sidebar-collapse" aria-label="收起侧栏" aria-expanded="true" aria-controls="navigation">‹</button>
  </div>
  <div id="identity" class="sidebar-account">验证当前会话…</div>
  <nav id="navigation" aria-label="主导航"></nav>
  <div class="sidebar-bottom"><a href="/admin-compat">原后台 ↗</a><button id="logout">退出登录</button></div>
</aside><div class="main-area"><header class="topbar"><button id="menu-toggle" aria-label="展开菜单">☰</button><h1 id="current-page" class="topbar-title">工作台</h1><button id="search-open" class="search-open">搜索已加载记录 <kbd>Ctrl / ⌘ K</kbd></button><button id="refresh">↻ 刷新</button></header><main><section id="workspace" aria-live="polite"></section></main></div></div><dialog id="detail" class="drawer" aria-labelledby="detail-title"><header class="drawer-header"><div><p class="eyebrow" id="detail-kind"></p><h2 id="detail-title"></h2><p id="detail-id" class="mono"></p><div id="detail-tags" class="tags"></div></div><button data-close="detail" aria-label="关闭详情">×</button></header><div id="detail-content" class="drawer-content"></div><footer id="detail-actions" class="drawer-actions"></footer></dialog><dialog id="danger" class="confirm" aria-labelledby="danger-title"><form id="danger-form"><header><h2 id="danger-title">确认高风险操作</h2><button type="button" data-close="danger" aria-label="关闭">×</button></header><div id="danger-diff"></div><label>操作原因（至少 10 个字符）<textarea name="reason" required minlength="10" maxlength="500" rows="3"></textarea></label><label>输入对象编号确认<input name="confirmation" required autocomplete="off"></label><p id="danger-message" role="alert"></p><footer><button type="button" data-close="danger">取消</button><button type="submit" class="danger-button">确认执行</button></footer></form></dialog><dialog id="command" class="command" aria-label="全局快捷搜索"><header><h2>搜索已加载记录</h2><button data-close="command" aria-label="关闭搜索">×</button></header><input id="command-query" type="search" placeholder="订单号、账户、Ticker、审批编号或审计编号" aria-label="搜索关键词"><p class="muted">仅搜索当前权限范围内已加载的数据，不代表全库检索。</p><div class="command-shortcuts"><button id="pin-page" type="button">☆ 收藏当前页</button><div id="recent" class="recent" aria-label="收藏与最近访问"></div></div><div id="command-results"></div></dialog><p id="toast" role="status" hidden></p><!--ADMIN_NEXT_APP--></body></html>
