(function(){

 function mount(host,{admin=false,onOpen}={}){
   const token=()=>localStorage.getItem(admin?'cncap.admin.session':'cncap.session');
   if(!host||!token())return;
   const button=el('button','cn-bell');button.type='button';button.title='消息通知';button.setAttribute('aria-label','消息通知');
   button.innerHTML=icon;
   const dot=el('span','cn-bell-dot');dot.hidden=true;dot.setAttribute('aria-hidden','true');button.append(dot);
   const dialog=el('dialog','cn-notify');dialog.setAttribute('aria-label','消息通知');
   const header=el('header','cn-notify-head'),close=el('button','cn-notify-close','关闭');

   let items=[],scope='',role='',seen=new Set(),unread=new Set(),pending,loaded=false;

   function refreshBadge(){
     dot.hidden=!unread.size;

   }

     list.replaceChildren();
     if(!items.length){list.append(el('p','cn-notify-state',loaded?'暂无消息':'正在读取通知…'));return}
     for(const item of items){
       const row=el('button','cn-notify-row');
       row.type='button';row.dataset.category=item.category;if(item.email)row.dataset.customer=item.email;
       if(unread.has(item.id))row.dataset.new='';

   }

     if(pending||!token())return pending||Promise.resolve();
     pending=fetch(admin?'/api/admin/notifications':'/api/notifications',{headers:{Authorization:'Bearer '+token()},cache:'no-store'})
       .then(async response=>{if(!response.ok)throw Error('通知读取失败');return response.json()})
       .then(data=>{
         if(!Array.isArray(data.items))throw Error('通知格式错误');
         if(data.scope!==scope){
           scope=data.scope||'';seen=new Set();
           if(scope)try{seen=new Set(JSON.parse(localStorage.getItem(key())||'[]'))}catch{}
         }
         role=data.role||'';items=data.items;loaded=true;
         unread=new Set(items.filter(item=>!seen.has(item.id)).map(item=>item.id));refreshBadge();
         if(dialog.open){render();mark()}
       }).catch(()=>{if(dialog.open&&!loaded)list.replaceChildren(el('p','cn-notify-state','通知暂时无法读取，请稍后重试。'))})
       .finally(()=>{pending=null});
     return pending;
   }
   button.onclick=async()=>{
     if(dialog.open)return;
     if(!loaded)await load();
     if(dialog.open)return;
     const next=items.filter(item=>unread.has(item.id));
     if(next.length===1){mark();onOpen?.(next[0],role);return}
     dialog.showModal();render();mark();load();
   };

function loadMobileCatalog(){
  return fetch('/api/catalog',{cache:'no-store',headers:{Authorization:'Bearer '+localStorage.getItem('cncap.session')}}).then(function(r){if(!r.ok)throw Error('Catalog '+r.status);return r.json()}).then(function(result){
    const version=JSON.stringify(result.items);if(version===catalogVersion)return;catalogVersion=version;
    const catalog={US:[],CN:[]};
    for(const row of result.items){
      if(!MK.includes(row.market)||typeof row.symbol!=='string'||!/^[A-Z0-9.-]{1,16}$/.test(row.symbol))continue;
      if(!catalog[row.market].includes(row.symbol))catalog[row.market].push(row.symbol);
      NAME[row.symbol]=String(row.name||row.symbol);
    }
    publishedProducts=result.items.filter(row=>MK.includes(row.market)&&/^[A-Z0-9.-]{1,16}$/.test(row.symbol));
    CAT=catalog;
    CFG=Object.fromEntries(result.items.filter(function(row){return row.market==='US'&&['STOCK','FUND'].includes(row.itemType)&&catalog.US.includes(row.symbol)}).map(function(row){return [row.symbol,{disc:0,hold:0,minq:1,type:row.itemType}]}));
    if(!CFG[D.sym])D.sym=Object.keys(CFG)[0]||'';
    R();
  });
}

async function supportRequest(message){
  const token=localStorage.getItem('cncap.session');
  if(!token){location.assign('/login');return null}
  const headers={Authorization:'Bearer '+token};
  if(message)headers['Content-Type']='application/json';
  const r=await fetch('/api/support',{method:message?'POST':'GET',headers:headers,body:message?JSON.stringify({message:message}):undefined,cache:'no-store'});
  if(r.status===401){location.assign('/login');return null}
  if(!r.ok)throw Error('Support HTTP '+r.status);
  return r.json();
}

  if(!token){location.assign('/login');return}
  const withdraw=D.sh==='wd',field=root.querySelector('#cash-withdraw-pin');

    if(o.allocation_micros!==null)controls.append(button('复核配售',()=>run({action:'review-allocation',order:o.id,shares:show(o.allocation_micros,6)},'确认 '+o.email+' 的配售股数？')));
   }else controls.textContent=labels[o.status]||o.status;
   return [o.email,o.symbol,show(o.requested_quantity_micros,6),show(o.allocation_micros,6),controls];
  }));
 }
 function renderCustomer(data){
  for(const p of data.catalog){
   const card=group(p.symbol+' · '+p.display_name);
   card.append(node('p',(p.kind==='IPO'?'发行价 ':'确认净值 ')+show(p.unit_price_micros,6)+' USD · '+p.effective_date.slice(0,10)));
   const refs={product:p.id,terms:p.terms_id};
   if(p.kind==='IPO')form(card,'提交 IPO 申购',[['quantity','申购股数']],v=>({...refs,action:'IPO_SUBSCRIBE',quantity:fixed(v.quantity,0)}));
   else {
    form(card,'提交基金申购',[['amount','申购金额 USD']],v=>({...refs,action:'FUND_SUBSCRIBE',amount:fixed(v.amount,2)}));
    form(card,'提交基金赎回',[['quantity','赎回份额']],v=>({...refs,action:'FUND_REDEEM',quantity:fixed(v.quantity,6)}));
   }
  }
  table(group('我的申购与赎回'),['产品','类型','状态','已结算数量','已结算金额 USD'],data.orders.map(o=>[o.symbol,labels[o.action]||o.action,labels[o.status]||o.status,show(o.settled_quantity_micros,6),show(o.settled_amount_cents,2)]));
  table(group('我的持仓'),['产品','数量'],data.positions.map(p=>[p.symbol,show(p.quantity_micros,6)]));
 }
 async function load(){
  const id=++version;status.textContent='正在读取…';
  try{const data=await request();if(id!==version||!dialog.open)return;content.replaceChildren();(admin?renderAdmin:renderCustomer)(data);status.textContent=''}
  catch(error){if(id===version)status.textContent=error.message}
 }
 function open(){
  if(admin&&document.documentElement.dataset.adminRole!=='MASTER')return;
  if(!dialog){
   dialog=node('dialog','','ps-dialog');dialog.setAttribute('aria-label','IPO 与普通基金');
   const head=node('header');head.append(node('strong','IPO 与普通基金'),button('关闭',()=>dialog.close()));
   status=node('p');status.setAttribute('role','status');content=node('div');
   dialog.append(head,status,content);document.body.append(dialog);
  }
  if(!dialog.open){dialog.showModal();load()}
 }
 window.addEventListener('cn-open-product-settlement',open);
 document.addEventListener('click',e=>{if(e.target.closest('[data-product-settlement-open]'))open()});
})();
</script><style>
:is(button,[role="button"]):not(:disabled):not([aria-disabled="true"]):active{filter:brightness(.83)}
</style>
<script id="cn-mobile-touch-feedback">
window.addEventListener('click', function(event) {
  if (!event.isTrusted || event.detail === 0 || typeof navigator.vibrate !== 'function') return;
  const control = event.composedPath().find(node => node?.matches?.('button,[role="button"],input[type="button"],input[type="submit"]'));
  if (!control || control.matches(':disabled,[aria-disabled="true"]') || control.closest('[inert]')) return;
  try { navigator.vibrate(18); } catch {}
}, {capture:true, passive:true});
</script>
