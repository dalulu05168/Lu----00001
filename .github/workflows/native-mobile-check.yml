name: Native mobile verification
on:
  push:
    branches:
      - dev/mobile-ios-android-20261104
      - dev/mobile-store-readiness-20261104
    paths:
      - "mobile/**"
      - "src/account-deletion-service.mjs"
      - "src/http-api.mjs"
      - "src/admin-http.mjs"
      - "web/admin.html"
      - "web/admin.mjs"
      - "test/postgres-integration.test.mjs"
      - "test/admin-visual-system.test.mjs"
      - "db/012_account_deletion_requests.sql"
      - "web/account-deletion*"
      - "test/account-deletion-api.test.mjs"
      - ".github/workflows/native-mobile-check.yml"
  workflow_dispatch:

jobs:
  typecheck-and-api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native project dependencies
        run: npm install --no-audit --no-fund
      - name: Static typecheck and API unit tests
        run: npm run check
      - name: Assert store release is denied without verified legal and deployment prerequisites
        run: |
          if npm run release:verify > release-gate.log 2>&1; then
            cat release-gate.log
            echo "Unexpected release authorization" >&2
            exit 1
          fi
          grep -q "STORE RELEASE BLOCKED" release-gate.log
          echo "Verified: unapproved store release is blocked"
      - name: Bundle Android JavaScript and assets
        run: npx expo export --platform android --output-dir dist-android
      - name: Bundle iOS JavaScript and assets
        run: npx expo export --platform ios --output-dir dist-ios

  deletion-backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API test dependencies
        run: npm install --no-audit --no-fund
      - name: Verify account deletion API, authentication and public webpage
        run: node --test test/account-deletion-api.test.mjs
