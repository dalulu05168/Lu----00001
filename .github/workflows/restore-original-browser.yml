name: Verify original restored workbenches in Chromium
on:
  push:
    branches: ['restore/frontend-admin-pre-ui-20261107']
  pull_request:
    paths:
      - 'web/index.html'
      - 'web/admin.html'
      - 'scripts/restore-original-browser.mjs'
      - '.github/workflows/restore-original-browser.yml'
permissions:
  contents: read
jobs:
  visual-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install node and chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: node --check scripts/restore-original-browser.mjs
      - name: Chromium restored original workbenches (isolated, unauthenticated)
        run: node scripts/restore-original-browser.mjs
      - name: Keep screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-workspaces-browser
          path: artifacts/original-ui-restore/
          if-no-files-found: warn
          retention-days: 14
